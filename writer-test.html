<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dad Writer Test</title>
  <style>body{max-width:560px;margin:40px auto;padding:0 20px;font-family:system-ui,sans-serif;background:#111;color:#f5f5f5}label{display:block;margin:18px 0 6px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #555;background:#1d1d1f;color:#fff}button{margin-top:16px;font-weight:700}.status{margin-top:18px;white-space:pre-wrap}small{color:#aaa}</style>
</head>
<body>
  <h1>Dad rejection writer test</h1>
  <p>This sends one harmless test row to REJECTED_SONGS.csv. The token stays in this page only and is not saved.</p>
  <label for="token">WRITE_TOKEN</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false" />
  <button id="run" type="button">Send test rejection</button>
  <div id="status" class="status"></div>
  <small>Do not paste the token into chat.</small>
<script>
(() => {
  const URL = 'https://script.google.com/macros/s/AKfycbzIJiEs8am_cuc4Yar1cb-8CIiN8tnJv_tm2Np6_a3t-_muPZnesL25HAnDzEfQSHpb/exec';
  const TEST_ID = 'dad-writer-test-2026-10-22';
  const button = document.getElementById('run');
  const status = document.getElementById('status');
  button.addEventListener('click', async () => {
    const token = document.getElementById('token').value.trim();
    if (!token) { status.textContent = 'Enter the WRITE_TOKEN first.'; return; }
    button.disabled = true;
    status.textContent = 'Sending…';
    try {
      const body = new URLSearchParams({
        token,
        id: TEST_ID,
        name: '__DAD_WRITER_TEST__',
        rejectedAt: new Date().toISOString()
      });
      await fetch(URL, { method: 'POST', mode: 'no-cors', body });
      status.textContent = 'SENT. Tell ChatGPT only: sent';
    } catch (error) {
      status.textContent = 'Browser send failed: ' + (error?.message || error);
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
