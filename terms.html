<h1>Dad's Music 이용약관</h1>
<p>Dad's Music은 개인 및 가족 사용을 위한 비상업적 웹 앱입니다. 사용자는 자신이 접근 권한을 가진 Google Drive 콘텐츠만 사용해야 합니다.</p>
<p>앱의 “빼기” 기능은 음악을 기기에서 제거하고 향후 다운로드 제외 상태를 기록하지만 Google Drive의 원본 오디오를 직접 삭제하지 않습니다. Drive 원본의 최종 삭제 및 관리는 Drive 소유자가 담당합니다.</p>
<p>오프라인 기능은 브라우저와 운영체제의 저장공간 정책에 영향을 받을 수 있습니다.</p>
