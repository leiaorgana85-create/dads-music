<!doctype html>
<html lang="ko" data-app-version="v1.00">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json?v=7" />
  <link rel="icon" href="./dad-icon.png?v=4" type="image/png" />
  <link rel="apple-touch-icon" href="./dad-icon.png?v=4" />
  <link rel="stylesheet" href="styles.css?v=3" />
  <title>아빠 음악</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow">오프라인 음악</div><div class="title-row"><h1>아빠 음악</h1></div></div>
      <div class="top-actions">
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="설정"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        <button id="syncBtn" class="sync-btn" type="button">음악 업데이트</button>
      </div>
    </header>

    <section class="status-card" aria-live="polite"><div id="statusTitle" class="status-title">저장된 목록을 불러오는 중…</div><div id="statusDetail" class="status-detail"></div></section>

    <main>
      <div class="section-head"><h2>전체</h2><div class="section-actions"><button id="shuffleBtn" class="option-btn list-shuffle-btn" type="button" aria-pressed="false">셔플</button><div id="trackCount" class="track-count">0개</div></div></div>
      <div id="trackList" class="track-list"></div><div id="emptyState" class="empty-state hidden">아직 저장된 음악이 없습니다.</div>
    </main>
  </div>

  <section id="player" class="player hidden" aria-label="재생 중">
    <div class="now-row"><div class="now-copy"><div id="nowTitle" class="now-title">—</div><div id="nowStatus" class="now-status">—</div></div><div class="player-options"><button id="repeatBtn" class="option-btn repeat-btn" type="button" aria-label="전체 반복">↻ 전체</button></div></div>
    <div class="seek-wrap"><input id="seek" class="seek" type="range" min="0" max="1000" value="0" /><div class="seek-times"><span id="timeCurrent" class="time-current">0:00</span><span id="timeTotal" class="time-total">0:00</span></div></div>
    <div class="controls"><button id="prevBtn" class="control-btn" type="button" aria-label="이전 곡"><span class="skip-icon skip-prev" aria-hidden="true"><span class="skip-bar"></span><span class="skip-triangle"></span></span></button><button id="playBtn" class="play-btn" data-state="play" type="button" aria-label="재생"></button><button id="nextBtn" class="control-btn" type="button" aria-label="다음 곡"><span class="skip-icon skip-next" aria-hidden="true"><span class="skip-triangle"></span><span class="skip-bar"></span></span></button></div>
  </section>

  <dialog id="settingsDialog" class="dialog settings-dialog">
    <form method="dialog">
      <div class="dialog-title">설정</div>

      <section class="settings-section settings-first">
        <div class="settings-section-title">저장공간</div>
        <div class="settings-row"><span class="settings-row-label">오프라인 오디오</span><span id="offlineStats" class="settings-row-value">0개 · 0 MB</span></div>
        <div class="settings-row"><span class="settings-row-label">브라우저 저장공간</span><span id="storageEstimate" class="settings-row-value">계산 중…</span></div>
        <div class="settings-storage-actions"><button id="deleteOfflineBtn" type="button" class="button secondary full-width">모든 오프라인 오디오 삭제</button></div>
        <p id="storageResult" class="settings-storage-result"></p>
      </section>

      <section class="settings-section">
        <div class="settings-section-title">Google Drive</div>
        <div class="settings-row"><span class="settings-row-label">연결 상태</span><span id="driveStorageStatus" class="settings-row-value">확인 중…</span></div>
        <div class="settings-row"><span class="settings-row-label">제외한 노래</span><span id="rejectedStats" class="settings-row-value">0개</span></div>
        <label class="field"><span>Google Drive API 키</span><input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false" /></label>
        <button id="saveSettingsBtn" type="button" class="button secondary full-width">API 키 저장</button>
      </section>

      <details class="settings-section settings-advanced">
        <summary>고급 설정</summary>
        <label class="field"><span>Google Drive 폴더 ID</span><input id="folderIdInput" type="text" autocomplete="off" /></label>
        <button type="button" class="button secondary full-width" onclick="document.getElementById('saveSettingsBtn').click()">폴더 설정 저장</button>
      </details>

      <details class="settings-section settings-troubleshooting"><summary>문제 해결</summary><button id="factoryResetBtn" type="button" class="danger-btn">이 기기에서 아빠 음악 초기화</button></details>
      <div class="dialog-actions"><button value="cancel" class="button secondary">닫기</button></div>
      <small id="appVersion" data-version="v1.00" style="display:block;font-size:10px;line-height:1.5;font-weight:400;color:var(--muted,#888);text-align:right;margin:10px 0 0">v1.00</small>
    </form>
  </dialog>

  <audio id="audio" preload="metadata" playsinline></audio>
  <script src="dad-writer-bridge.js?v=2"></script>
  <script src="audio-storage.js?v=3"></script>
  <script src="metadata.js?v=1" defer></script>
  <script src="track-list-display.js?v=1" defer></script>
  <script src="app.js?v=10" defer></script>
  <script src="player-artwork.js?v=2" defer></script>
  <script src="media-session-controls.js?v=5" defer></script>
</body>
</html>
