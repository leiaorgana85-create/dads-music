<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dad Writer v5 Final Test</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:620px;margin:40px auto;padding:0 18px;line-height:1.45}#status{font-weight:700;margin-top:18px;white-space:pre-wrap}</style></head><body><h2>Dad Writer v5 — Automated Test</h2><div id="status">STARTING</div><script>
(() => {
  'use strict';
  const WRITER='https://script.google.com/macros/s/AKfycbz_XRJcYb9_2bMZWeX9kDVJkbVxcjH-znPH0yHiUgGiJUXktPxCbClo3WLSLL1NvC5e/exec';
  const FILE_ID='1KQnz5mv7zWX6feeQXoR9eoiGPlRW6Ovr';
  const EXPECTED_NAME='__DAD_WRITER_V4_TEST__.mp3';
  const status=document.getElementById('status');
  const nonce='v5test_'+crypto.getRandomValues(new Uint32Array(4)).join('_');
  const requestId='req_'+crypto.getRandomValues(new Uint32Array(3)).join('_');
  let bridgeOrigin='';
  let configPassed=false;
  let drivePassed=false;
  const iframe=document.createElement('iframe');
  iframe.hidden=true;
  iframe.src=WRITER+'?mode=bridge&nonce='+encodeURIComponent(nonce)+'&t='+Date.now();
  document.body.appendChild(iframe);

  function allowed(origin){
    try{const u=new URL(origin);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||u.hostname.endsWith('.googleusercontent.com'));}catch{return false;}
  }
  function fail(message){ status.textContent='FINAL=FAIL\n'+message; }

  window.addEventListener('message', async event => {
    if(event.source!==iframe.contentWindow||!allowed(event.origin)) return;
    const data=event.data||{};
    if(data.type==='dad-music-config-error'&&data.nonce===nonce){ fail('CONFIG_ERROR'); return; }
    if(data.type==='dad-music-config'&&data.nonce===nonce){
      try{
        if(!/^AIza[\w-]{20,}$/.test(String(data.apiKey||''))) throw new Error('BAD_API_KEY');
        bridgeOrigin=event.origin;
        configPassed=true;
        status.textContent='CONFIG=PASS';
        const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(FILE_ID)+'?fields=id,name,mimeType&key='+encodeURIComponent(data.apiKey));
        if(!r.ok) throw new Error('DRIVE_HTTP_'+r.status);
        const meta=await r.json();
        if(meta.id!==FILE_ID||meta.name!==EXPECTED_NAME) throw new Error('DRIVE_MISMATCH');
        drivePassed=true;
        status.textContent='CONFIG=PASS\nDRIVE=PASS';
        iframe.contentWindow.postMessage({type:'dad-music-reject',nonce,requestId,id:FILE_ID},bridgeOrigin);
      }catch(e){ fail(e.message||String(e)); }
      return;
    }
    if(data.type==='dad-music-reject-result'&&data.nonce===nonce&&data.requestId===requestId){
      if(configPassed&&drivePassed&&data.id===FILE_ID&&data.ok===true) status.textContent='CONFIG=PASS\nDRIVE=PASS\nWRITE=PASS\nFINAL=PASS';
      else fail('WRITE_FAILED');
    }
  });
  setTimeout(()=>{if(!status.textContent.includes('FINAL=')) fail('TIMEOUT');},20000);
})();
</script></body></html>
