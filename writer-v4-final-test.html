<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dad Writer v4 Final Test</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:620px;margin:40px auto;padding:0 18px;line-height:1.45}#status{font-weight:700;margin-top:18px;white-space:pre-wrap}</style></head><body><h2>Dad Writer v4 — Final Test</h2><p>This runs automatically from the real GitHub Pages origin.</p><div id="status">Starting…</div><script>
const WRITER='https://script.google.com/macros/s/AKfycbz_XRJcYb9_2bMZWeX9kDVJkbVxcjH-znPH0yHiUgGiJUXktPxCbClo3WLSLL1NvC5e/exec';
const FILE_ID='1KQnz5mv7zWX6feeQXoR9eoiGPlRW6Ovr';
const status=document.getElementById('status');
let finished=false;
window.dadMusicReceiveConfig=async cfg=>{
  try{
    if(!cfg||!/^AIza[\w-]{20,}$/.test(String(cfg.apiKey||''))) throw new Error('Config did not return a valid API key');
    status.textContent='1/3 Config bootstrap: PASS\nChecking Drive API…';
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(FILE_ID)}?fields=id,name,mimeType&key=${encodeURIComponent(cfg.apiKey)}`);
    if(!r.ok) throw new Error(`Drive API failed: HTTP ${r.status}`);
    const meta=await r.json();
    if(meta.id!==FILE_ID||meta.name!=='__DAD_WRITER_V4_TEST__.mp3') throw new Error('Drive API returned unexpected file');
    status.textContent='1/3 Config bootstrap: PASS\n2/3 Drive API read: PASS\nSending rejection…';
    await fetch(WRITER,{method:'POST',mode:'no-cors',body:new URLSearchParams({token:'writer-v2',id:FILE_ID,name:meta.name,rejectedAt:new Date().toISOString()})});
    finished=true;
    status.textContent='1/3 Config bootstrap: PASS\n2/3 Drive API read: PASS\n3/3 Rejection submitted: PASS\n\nFINAL TEST SENT — tell ChatGPT “test sent”.';
  }catch(e){status.textContent='FAIL: '+(e&&e.message?e.message:String(e));}
};
const s=document.createElement('script');
s.src=WRITER+'?action=config&callback=dadMusicReceiveConfig&t='+Date.now();
s.onerror=()=>{if(!finished) status.textContent='FAIL: config endpoint did not load';};
document.head.appendChild(s);
setTimeout(()=>{if(!finished&&!status.textContent.startsWith('FAIL')) status.textContent='FAIL: timed out waiting for config';},12000);
</script></body></html>
