<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>아빠 음악 초기화</title><style>html,body{margin:0;min-height:100%;background:#0d0d0e;color:#f4f4f5;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:520px;margin:auto;padding:48px 20px}.card{background:#171719;border:1px solid #303036;border-radius:16px;padding:20px}h1{font-size:22px;margin:0 0 10px}p{color:#a4a4ad;line-height:1.5;font-size:13px}.status{margin-top:18px;color:#dec684;font-weight:700}button{margin-top:18px;border:1px solid #303036;border-radius:10px;background:transparent;color:#f4f4f5;padding:10px 14px}</style></head><body><div class="wrap"><div class="card"><h1>아빠 음악 초기화</h1><p>이 기기의 Dad’s Music 데이터만 삭제합니다. Google Drive 음악과 Drive의 REJECTED_SONGS.csv는 삭제하지 않습니다.</p><div id="status" class="status">초기화 중…</div><button id="returnBtn" type="button" hidden>아빠 음악으로 돌아가기</button></div></div><script>
(async()=>{const status=document.getElementById('status'),btn=document.getElementById('returnBtn');function delDb(name){return new Promise((resolve,reject)=>{const r=indexedDB.deleteDatabase(name);r.onsuccess=resolve;r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error(name+' 사용 중'));})}try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];for(const reg of regs){if(reg.scope.includes('/dads-music/'))await reg.unregister();}const names=await caches.keys();await Promise.all(names.filter(n=>n.startsWith('dads-music-v')).map(n=>caches.delete(n)));await delDb('dads-music-audio-db');await delDb('dads-music-db');['dadsMusicSettings','dadsMusicPositions','dadsMusicRepeatMode','dadsMusicShuffle','dadsMusicRejectedLocal','dadsMusicRejectedPending','dadsMusicPublicApiKey','dadsMusicWriterUrl','dadsMusicWriterToken','dadsMusicGoogleAccessToken','dadsMusicGoogleAuthorized','dadsMusicGoogleForceConsent'].forEach(k=>localStorage.removeItem(k));status.textContent='초기화 완료';btn.hidden=false;}catch(e){status.textContent='완전히 초기화하지 못했습니다: '+(e.message||e);btn.hidden=false;}btn.addEventListener('click',()=>location.href='./');})();
</script></body></html>
