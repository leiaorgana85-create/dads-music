name: dad-writer-v5-endpoint-probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dad-writer-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Apps Script frame bootstrap metadata
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbz_XRJcYb9_2bMZWeX9kDVJkbVxcjH-znPH0yHiUgGiJUXktPxCbClo3WLSLL1NvC5e/exec'
          NONCE='githubProbe_meta_20261022abcdef'
          test "$(curl -sS -L --max-time 30 "$BASE?mode=health")" = 'dad-writer-v5'
          curl -sS -L --max-time 30 -o /tmp/body "$BASE?mode=bridge&nonce=$NONCE"
          python3 - <<'PY'
          import re, html
          body=open('/tmp/body',encoding='utf-8',errors='replace').read()
          # Pull the script block that creates sandboxFrame and redact credential-like payloads.
          pos=body.find("userCodeAppPanel")
          start=max(0,pos-5000); end=min(len(body),pos+1200)
          s=html.unescape(body[start:end])
          s=re.sub(r'AIza[A-Za-z0-9_-]{20,}','AIza[REDACTED]',s)
          s=re.sub(r'[A-Fa-f0-9]{32}','[SESSION_REDACTED]',s)
          # Replace long quoted/escaped payloads while leaving assignment structure visible.
          s=re.sub(r'(["\'])(?:(?!\1).){500,}\1','"[LONG_PAYLOAD_REDACTED]"',s,flags=re.S)
          s=re.sub(r'\\x22AIza[^\\]{20,}', r'\\x22AIza[REDACTED]', s)
          print('SANDBOX_CONTEXT_BEGIN')
          print(s[:6200])
          print('SANDBOX_CONTEXT_END')
          for pat in [r'\.name\s*=',r'setAttribute\([^)]*name',r'window\.name',r'el\.[A-Za-z_$][\w$]*\s*=']:
              print('PATTERN',pat,'COUNT',len(re.findall(pat,body,re.I)))
          PY
