name: dad-writer-v5-endpoint-probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dad-writer-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Identify Apps Script sandbox assignments
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbz_XRJcYb9_2bMZWeX9kDVJkbVxcjH-znPH0yHiUgGiJUXktPxCbClo3WLSLL1NvC5e/exec'
          NONCE='githubProbe_assign_20261022abcdef'
          curl -sS -L --max-time 30 -o /tmp/body "$BASE?mode=bridge&nonce=$NONCE"
          python3 - <<'PY'
          import re
          body=open('/tmp/body',encoding='utf-8',errors='replace').read()
          pos=body.find("var el = document.getElementById('sandboxFrame')")
          if pos < 0: raise SystemExit('bootstrap block not found')
          end=body.find('}());',pos)
          block=body[pos:end+5]
          for m in re.finditer(r'el\.([A-Za-z_$][\w$]*)\s*=\s*(.*?);',block,re.S):
              prop=m.group(1); rhs=m.group(2).strip()
              kind='function' if rhs.startswith('function') else ('string' if rhs.startswith(("'",'"')) else 'other')
              print(f'ASSIGN prop={prop} kind={kind} rhs_len={len(rhs)}')
              if prop == 'src':
                  s=re.search(r"'([^']*)'",rhs)
                  if s:
                      from urllib.parse import urlparse
                      u=s.group(1).replace('\\/','/')
                      p=urlparse(u)
                      print('SRC_HOST='+p.netloc)
                      print('SRC_PATH='+p.path)
          # Safe structural calls around the iframe element.
          for m in re.finditer(r'el\.([A-Za-z_$][\w$]*)\((.*?)\);',block,re.S):
              print(f'CALL method={m.group(1)} arg_len={len(m.group(2))}')
          print('BLOCK_LEN='+str(len(block)))
          PY
