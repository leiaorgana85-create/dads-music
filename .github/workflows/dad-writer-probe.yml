name: dad-writer-v5-endpoint-probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dad-writer-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Apps Script sandbox onload relay
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbz_XRJcYb9_2bMZWeX9kDVJkbVxcjH-znPH0yHiUgGiJUXktPxCbClo3WLSLL1NvC5e/exec'
          NONCE='githubProbe_onload_20261022abcdef'
          curl -sS -L --max-time 30 -o /tmp/body "$BASE?mode=bridge&nonce=$NONCE"
          python3 - <<'PY'
          import re, html
          body=open('/tmp/body',encoding='utf-8',errors='replace').read()
          pos=body.find("var el = document.getElementById('sandboxFrame')")
          if pos < 0: raise SystemExit('bootstrap not found')
          start=body.find('el.onload =',pos)
          stop=body.find('el.src =',start)
          if start < 0 or stop < 0: raise SystemExit('onload boundaries not found')
          s=html.unescape(body[start:stop])
          s=re.sub(r'AIza[A-Za-z0-9_-]{20,}','AIza[REDACTED]',s)
          s=re.sub(r'[A-Fa-f0-9]{32}','[SESSION_REDACTED]',s)
          # Redact long quoted values while preserving code structure.
          s=re.sub(r'(["\'])([^"\']{121,})\1',lambda m:m.group(1)+'[REDACTED_LEN_'+str(len(m.group(2)))+']'+m.group(1),s)
          print('ONLOAD_BEGIN')
          print(s[:5000])
          print('ONLOAD_END')
          for key in ['postMessage','contentWindow','location','src','docurl','userHtml','html','url','rpc','message']:
              print(key.upper()+'_COUNT='+str(s.lower().count(key.lower())))
          PY
