name: dad-writer-v5-endpoint-probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dad-writer-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Apps Script sandbox relay structure
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbz_XRJcYb9_2bMZWeX9kDVJkbVxcjH-znPH0yHiUgGiJUXktPxCbClo3WLSLL1NvC5e/exec'
          NONCE='githubProbeNonce20261022abc123'
          test "$(curl -sS -L --max-time 30 "$BASE?mode=health")" = 'dad-writer-v5'
          echo 'HEALTH=PASS'
          curl -sS -L --max-time 30 -o /tmp/body "$BASE?mode=bridge&nonce=$NONCE"
          python3 - <<'PY'
          import html,re
          body=open('/tmp/body',encoding='utf-8',errors='replace').read()
          print('POSTMESSAGE_COUNT=', body.count('postMessage'))
          print('MESSAGE_LISTENER_COUNT=', body.count("addEventListener('message'") + body.count('addEventListener("message"'))
          print('IFRAME_COUNT=', len(re.findall(r'<iframe\b',body,re.I)))
          # Print only structural snippets and redact keys/session-looking tokens.
          for label,pattern in [
              ('IFRAME',r'<iframe\b[^>]{0,1800}>'),
              ('USER_PANEL',r'.{0,350}userCodeAppPanel.{0,900}'),
              ('POSTMESSAGE',r'.{0,250}postMessage.{0,500}'),
              ('MESSAGE_EVENT',r'.{0,250}message.{0,500}')]:
              m=re.search(pattern,body,re.I|re.S)
              if not m:
                  print(label+'=NONE'); continue
              s=html.unescape(m.group(0))
              s=re.sub(r'AIza[A-Za-z0-9_-]{20,}','AIza[REDACTED]',s)
              s=re.sub(r'[A-Fa-f0-9]{32}','[SESSION_REDACTED]',s)
              s=re.sub(r'\s+',' ',s)
              print(label+'='+s[:1600])
          # Find frame src hosts without printing sensitive query values.
          from urllib.parse import urlparse
          srcs=re.findall(r'<iframe\b[^>]*\bsrc=["\']([^"\']+)',body,re.I)
          for i,src in enumerate(srcs[:10]):
              p=urlparse(src)
              print(f'IFRAME_SRC_{i}={p.scheme}://{p.netloc}{p.path}')
          PY
