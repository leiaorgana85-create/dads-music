name: dad-writer-v5-endpoint-probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dad-writer-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed Apps Script v5 bridge response
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbz_XRJcYb9_2bMZWeX9kDVJkbVxcjH-znPH0yHiUgGiJUXktPxCbClo3WLSLL1NvC5e/exec'
          test "$(curl -sS -L --max-time 30 "$BASE?mode=health")" = 'dad-writer-v5'
          echo 'HEALTH=PASS'

          NONCE='githubProbeNonce20261022abc123'
          HTTP_CODE=$(curl -sS -L --max-time 30 -D /tmp/headers -o /tmp/body -w '%{http_code}' "$BASE?mode=bridge&nonce=$NONCE")
          echo "HTTP_CODE=$HTTP_CODE"
          echo "CONTENT_TYPE=$(grep -i '^content-type:' /tmp/headers | tail -1 | tr -d '\r' | cut -d' ' -f2-)"
          echo "X_FRAME_OPTIONS=$(grep -i '^x-frame-options:' /tmp/headers | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)"
          echo "CSP=$(grep -i '^content-security-policy:' /tmp/headers | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)"
          echo "BODY_BYTES=$(wc -c < /tmp/body)"
          python3 - <<'PY'
          import re
          body=open('/tmp/body',encoding='utf-8',errors='replace').read()
          checks={
            'TITLE_BRIDGE':'Dad Music Bridge' in body,
            'CONFIG_TYPE':'dad-music-config' in body,
            'SCRIPT_RUN':'google.script.run' in body,
            'PARENT_ORIGIN':'https://leiaorgana85-create.github.io' in body,
            'NONCE':'githubProbeNonce20261022abc123' in body,
            'API_KEY':bool(re.search(r'"apiKey":"AIza[A-Za-z0-9_-]{20,}"',body)),
            'GOOGLE_WRAPPER':('script.googleusercontent.com' in body or 'userCodeAppPanel' in body or 'sandboxMode' in body),
          }
          for k,v in checks.items(): print(f'{k}={"YES" if v else "NO"}')
          redacted=re.sub(r'AIza[A-Za-z0-9_-]{20,}','AIza[REDACTED]',body[:1200])
          redacted=re.sub(r'[A-Fa-f0-9]{32}', '[SESSION_REDACTED]', redacted)
          print('BODY_PREFIX=' + redacted.replace('\n',' ')[:1200])
          PY
          test "$HTTP_CODE" = '200'
