name: dad-writer-endpoint-probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dad-writer-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed Apps Script config endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbz_XRJcYb9_2bMZWeX9kDVJkbVxcjH-znPH0yHiUgGiJUXktPxCbClo3WLSLL1NvC5e/exec?action=config&callback=dadMusicReceiveConfig&probe=github'
          HTTP_CODE=$(curl -sS -L --max-time 30 -D /tmp/headers -o /tmp/body -w '%{http_code}' "$URL")
          echo "HTTP_CODE=$HTTP_CODE"
          echo "CONTENT_TYPE=$(grep -i '^content-type:' /tmp/headers | tail -1 | tr -d '\r' | cut -d' ' -f2-)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo 'RESULT=HTTP_FAILURE'
            exit 1
          fi
          if grep -Eq '^dadMusicReceiveConfig\(\{"apiKey":"AIza[A-Za-z0-9_-]{20,}"' /tmp/body; then
            echo 'RESULT=JSONP_VALID'
          elif grep -q 'dadMusicReceiveConfig' /tmp/body; then
            echo 'RESULT=CALLBACK_PRESENT_BUT_CONFIG_INVALID'
            exit 1
          else
            echo 'RESULT=NOT_JSONP'
            exit 1
          fi
