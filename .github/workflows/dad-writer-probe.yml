name: dad-writer-v5-endpoint-probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dad-writer-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed Apps Script v5 endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbz_XRJcYb9_2bMZWeX9kDVJkbVxcjH-znPH0yHiUgGiJUXktPxCbClo3WLSLL1NvC5e/exec'

          HEALTH_CODE=$(curl -sS -L --max-time 30 -o /tmp/health -w '%{http_code}' "$BASE?mode=health")
          test "$HEALTH_CODE" = '200'
          test "$(cat /tmp/health)" = 'dad-writer-v5'
          echo 'HEALTH=PASS'

          NONCE='githubProbeNonce20261022abc123'
          BRIDGE_CODE=$(curl -sS -L --max-time 30 -D /tmp/bridge_headers -o /tmp/bridge -w '%{http_code}' "$BASE?mode=bridge&nonce=$NONCE")
          test "$BRIDGE_CODE" = '200'
          grep -q 'Dad Music Bridge' /tmp/bridge
          grep -q 'dad-music-config' /tmp/bridge
          grep -q 'google.script.run' /tmp/bridge
          grep -q 'https://leiaorgana85-create.github.io' /tmp/bridge
          grep -Eq '"apiKey":"AIza[A-Za-z0-9_-]{20,}"' /tmp/bridge
          grep -q "$NONCE" /tmp/bridge
          echo 'BRIDGE=PASS'
