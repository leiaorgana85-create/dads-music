name: dad-writer-v5-endpoint-probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dad-writer-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Apps Script sandbox onload relay
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbz_XRJcYb9_2bMZWeX9kDVJkbVxcjH-znPH0yHiUgGiJUXktPxCbClo3WLSLL1NvC5e/exec'
          NONCE='githubProbe_onload_20261022abcdef'
          curl -sS -L --max-time 30 -o /tmp/body "$BASE?mode=bridge&nonce=$NONCE"
          python3 - <<'PY'
          import re, html
          body=open('/tmp/body',encoding='utf-8',errors='replace').read()
          pos=body.find("var el = document.getElementById('sandboxFrame')")
          end=body.find('}());',pos)
          block=body[pos:end+5]
          m=re.search(r'el\.onload\s*=\s*(function\s*\(.*?\n\s*\});)',block,re.S)
          if not m: raise SystemExit('onload not found')
          s=html.unescape(m.group(1))
          s=re.sub(r'AIza[A-Za-z0-9_-]{20,}','AIza[REDACTED]',s)
          s=re.sub(r'[A-Fa-f0-9]{32}','[SESSION_REDACTED]',s)
          # Preserve JS structure and short literals; replace very long literals with length markers.
          def repl(match):
              q,val=match.group(1),match.group(2)
              if len(val)>120: return q+'[REDACTED_LEN_'+str(len(val))+']'+q
              return match.group(0)
          s=re.sub(r'(["\'])(.*?)(?<!\\)\1',repl,s,flags=re.S)
          print('ONLOAD_BEGIN')
          print(s)
          print('ONLOAD_END')
          for key in ['postMessage','contentWindow','location','src','docurl','userHtml','html','url']:
              print(key.upper()+'_COUNT='+str(s.count(key)))
          PY
