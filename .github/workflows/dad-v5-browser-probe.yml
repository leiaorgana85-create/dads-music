name: dad-v5-browser-probe
on:
  push:
    branches: [main]
  workflow_dispatch:

# temporary instrumented rerun
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify v5 from real GitHub Pages origin
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbz_XRJcYb9_2bMZWeX9kDVJkbVxcjH-znPH0yHiUgGiJUXktPxCbClo3WLSLL1NvC5e/exec'
          TEST_URL='https://leiaorgana85-create.github.io/dads-music/writer-v5-final-test.html'

          test "$(curl -sS -L --max-time 30 "$BASE?mode=health")" = 'dad-writer-v5'
          echo 'HEALTH=PASS'

          for i in $(seq 1 24); do
            if curl -fsSL --max-time 15 "$TEST_URL" | grep -q 'TRACE='; then
              break
            fi
            sleep 5
          done
          curl -fsSL --max-time 15 "$TEST_URL" | grep -q 'TRACE='
          echo 'PAGES_TEST=LIVE'

          BROWSER=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then BROWSER="$candidate"; break; fi
          done
          test -n "$BROWSER"

          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom "$TEST_URL" > /tmp/dom.html 2>/tmp/chrome.err
          python3 - <<'PY'
          import html, re
          text=open('/tmp/dom.html',encoding='utf-8').read()
          tag=re.search(r'<html[^>]*>',text,re.I)
          status=re.search(r'<div id="status">(.*?)</div>',text,re.I|re.S)
          print('HTML_TAG=' + (tag.group(0) if tag else 'MISSING'))
          if status:
              value=re.sub(r'<[^>]+>','',status.group(1))
              print('STATUS=' + html.unescape(value).strip().replace('\n',' | '))
          else:
              print('STATUS=MISSING')
          PY
          HTML_TAG=$(grep -Eo '<html[^>]*>' /tmp/dom.html | head -1 || true)
          if printf '%s' "$HTML_TAG" | grep -q 'data-test-result="pass"'; then
            echo 'REAL_ORIGIN_BRIDGE=PASS'
          else
            echo 'REAL_ORIGIN_BRIDGE=FAIL'
            echo '--- chrome stderr tail ---'
            tail -60 /tmp/chrome.err || true
            exit 1
          fi
